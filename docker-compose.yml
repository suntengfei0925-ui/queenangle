services:
  queenangle-app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
    container_name: queenangle-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data/db
      - ./uploads:/data/uploads
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
